[package]
name = "chomiamos-dashboard"
version = "0.3.7"
edition = "2021"

[dependencies]
tauri = { version = "2.3", features = [] }
portable-pty = "0.8"
sysinfo = "0.33"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["io-util"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.11"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }
