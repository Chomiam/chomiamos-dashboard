[package]
name = "chomiamos-dashboard"
version = "0.1.0"
edition = "2024"

[dependencies]
async-stream = "0.3.6"
axum = "0.8.9"
mime_guess = "2.0.5"
regex = "1.13.1"
rust-embed = "8.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sysinfo = "0.39.6"
tokio = { version = "1.53.1", features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["io-util"] }
tower-http = { version = "0.7.1", features = ["cors"] }
