[package]
name = "chomiamos-dashboard"
version = "0.1.0"
edition = "2024"

[dependencies]
slint = "1.17.1"
sysinfo = "0.39.6"
tokio = { version = "1.53.1", features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["io-util"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
regex = "1.13.1"

[build-dependencies]
slint-build = "1.17.1"
